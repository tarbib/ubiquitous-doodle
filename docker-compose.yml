services:
  gares_bot:
    image: ghcr.io/tarbib/ubiquitous-doodle/gares_bot:latest
    build: .
    container_name: gares_bot
    restart: unless-stopped
    environment:
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - SNCF_TOKEN=${SNCF_TOKEN}
      - ALLOWED_USER_IDS=${ALLOWED_USER_IDS}
      - TZ=${TZ:-Europe/Paris}
    volumes:
      - ./data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"