services:
  gares_bot:
    image: ghcr.io/tarbib/ubiquitous-doodle/gares_bot:latest
    build: .
    container_name: gares_bot
    restart: unless-stopped
    environment:
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - SNCF_TOKEN=${SNCF_TOKEN}
      - ALLOWED_USER_IDS=${ALLOWED_USER_IDS}
      - TZ=${TZ:-Europe/Paris}
    volumes:
      - ./data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Le bot tourne en root dans le conteneur (isolé, sans autre capacité) ;
      # DAC_OVERRIDE lui permet d'écrire dans ./data quel que soit le
      # propriétaire côté hôte, sans jonglage d'utilisateur au démarrage.
      - DAC_OVERRIDE
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"