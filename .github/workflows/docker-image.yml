name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    # Autorisations requises pour que GitHub Actions puisse pousser l'image
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Convertir le nom du repo en minuscules (requis par Docker)
      run: echo "REPO=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

    - name: Connexion au GitHub Container Registry (GHCR)
      run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

    - name: Build de l'image Docker
      run: |
        docker build . --file Dockerfile \
          --tag ghcr.io/${{ env.REPO }}/gares_bot:latest \
          --tag ghcr.io/${{ env.REPO }}/gares_bot:${{ github.sha }}

    - name: Push de l'image Docker (uniquement sur un push, pas sur les PR)
      if: github.event_name != 'pull_request'
      run: |
        docker push ghcr.io/${{ env.REPO }}/gares_bot:latest
        docker push ghcr.io/${{ env.REPO }}/gares_bot:${{ github.sha }}
